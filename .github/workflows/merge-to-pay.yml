name: Merge to Pay

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Notify the payout service
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          request=$(jq -nc --arg pr "$REPOSITORY#$PR_NUMBER" '{pr: $pr}')
          status=0
          response=$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 540 \
            --header 'Content-Type: application/json' \
            --data "$request" \
            'https://agent-production-8f9c2448.up.railway.app/api/agent') || status=$?
          if [[ -z "$response" && "$status" -ne 0 ]]; then
            exit "$status"
          fi
          jq -ce 'select((.decision | type) == "string" and (.reason | type) == "string") | {decision, reason}' <<< "$response"
          exit "$status"
