name: Merge to Pay

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  notify-agent:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Call Merge-to-Pay agent
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_TARGET="${REPO}#${PR_NUMBER}"
          echo "Calling agent for ${PR_TARGET}..."
          PAYLOAD=$(jq -n --arg pr "$PR_TARGET" '{pr: $pr}')
          RESPONSE=$(curl -sS -X POST "https://agent-production-8f9c2448.up.railway.app/api/agent" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Agent response: ${RESPONSE}"
          DECISION=$(echo "$RESPONSE" | jq -r '.decision // "UNKNOWN"')
          REASON=$(echo "$RESPONSE" | jq -r '.reason // "UNKNOWN"')
          echo "Decision: ${DECISION}"
          echo "Reason: ${REASON}"
