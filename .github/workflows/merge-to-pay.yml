name: Merge to Pay

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify agent and report decision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          payload=$(jq -cn --arg pr "$REPOSITORY#$PR_NUMBER" '{pr: $pr}')
          response=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 240 \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            https://agent-production-8f9c2448.up.railway.app/api/agent)
          printf '%s\n' "$response" | jq -er '
            if (.decision | type) == "string" and (.reason | type) == "string"
            then "decision: \(.decision)\nreason: \(.reason)"
            else error("Agent response must contain decision and reason strings")
            end'
