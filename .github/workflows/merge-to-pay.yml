name: merge-to-pay

# Calls the Merge-to-Pay agent after a PR is merged, so the zkTLS proof and the
# payout no longer depend on someone running the README curl by hand within the
# one-hour merge window.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Call the agent for this merged PR
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          payload=$(jq -cn --arg pr "${REPO}#${PR_NUMBER}" '{pr: $pr}')
          echo "request: ${payload}"
          response=$(curl -sS --fail-with-body --max-time 300 \
            -H 'content-type: application/json' \
            -H 'accept: application/json' \
            -d "${payload}" \
            https://agent-production-8f9c2448.up.railway.app/api/agent)
          echo "response: ${response}"
          decision=$(jq -r '.decision // "UNKNOWN"' <<<"${response}")
          reason=$(jq -r '.reason // "UNKNOWN"' <<<"${response}")
          echo "decision: ${decision}"
          echo "reason: ${reason}"
          {
            echo "### merge-to-pay"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| PR | \`${REPO}#${PR_NUMBER}\` |"
            echo "| decision | \`${decision}\` |"
            echo "| reason | \`${reason}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
