name: Call merge-to-pay agent on merge

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  notify-agent:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Call agent and log decision
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          payload=$(jq -nc --arg repo "$REPOSITORY" --arg num "$PR_NUMBER" '{pr: "\($repo)#\($num)"}')
          echo "Calling agent with payload: $payload"

          response=$(curl -sS --max-time 120 \
            -X POST "https://agent-production-8f9c2448.up.railway.app/api/agent" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "Agent Response: $response"
          decision=$(echo "$response" | jq -r '.decision // empty')
          reason=$(echo "$response" | jq -r '.reason // empty')

          echo "Decision: $decision"
          echo "Reason: $reason"
